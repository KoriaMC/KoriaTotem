# CI/CD KoriaTotem : compile le plugin à chaque push / pull request et publie les .jar.
#  - chaque build : les .jar sont dans l'onglet Actions (artefact "KoriaTotem")
#  - push sur la branche par défaut : release "latest" mise à jour avec le .jar
#  - tag v* (ex. v1.2.0) : release versionnée avec le .jar
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer KoriaTotem
        uses: actions/checkout@v4
        with:
          path: KoriaTotem

      # KoriaFactions est une dépendance de compilation (pom.xml : ../KoriaFactions/target).
      # Repo privé : il faut le secret KORIA_CI_TOKEN (jeton en lecture sur KoriaMC/KoriaFactions).
      - name: Vérifier l'accès à KoriaFactions
        env:
          GH_TOKEN: ${{ secrets.KORIA_CI_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret KORIA_CI_TOKEN manquant : ce plugin dépend de KoriaFactions (repo privé)."
            exit 1
          fi
          if ! gh api repos/KoriaMC/KoriaFactions --jq .full_name; then
            echo "::error::Le jeton KORIA_CI_TOKEN ne voit pas KoriaMC/KoriaFactions."
            echo "Compte du jeton : $(gh api user --jq .login 2>&1)"
            echo "Repos KoriaMC visibles : $(gh api 'orgs/KoriaMC/repos?type=all&per_page=100' --jq '[.[].name] | join(", ")' 2>&1)"
            exit 1
          fi

      - name: Récupérer KoriaFactions (même branche si elle existe)
        id: factions-branch
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: KoriaMC/KoriaFactions
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.KORIA_CI_TOKEN }}
          path: KoriaFactions

      - name: Récupérer KoriaFactions (branche par défaut)
        if: steps.factions-branch.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: KoriaMC/KoriaFactions
          token: ${{ secrets.KORIA_CI_TOKEN }}
          path: KoriaFactions

      - name: Compiler KoriaFactions
        run: mvn -B -ntp -q clean package -DskipTests
        working-directory: KoriaFactions

      - name: Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: KoriaTotem/pom.xml

      - name: Compiler KoriaTotem
        run: mvn -B -ntp clean package -DskipTests
        working-directory: KoriaTotem

      - name: Préparer les .jar
        run: |
          mkdir -p dist
          find KoriaTotem/target -maxdepth 1 -name '*.jar' ! -name 'original-*' -exec cp {} dist/ \;
          ls -l dist

      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: KoriaTotem
          path: dist/*.jar
          if-no-files-found: error

      - name: Release "latest" (branche par défaut)
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.jar --target "$GITHUB_SHA" --latest \
            --title "KoriaTotem - dernière version" \
            --notes "Build automatique de la branche $GITHUB_REF_NAME (commit ${GITHUB_SHA::7})."

      - name: Release versionnée (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.jar --title "KoriaTotem $GITHUB_REF_NAME" --generate-notes
